# 버전 태그(v1.2.3)를 푸시하면 Windows 설치 파일을 만들어 GitHub Release에 올린다.
# 설치본의 electron-updater는 이 Release의 latest.yml을 보고 새 버전을 받는다.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # electron-builder는 package.json의 version으로 Release 이름(v<version>)과
      # latest.yml을 만든다. 태그와 어긋나면 엉뚱한 Release에 올라가므로 먼저 막는다
      - name: 태그와 package.json 버전 일치 확인
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "태그 v$tag 와 package.json 버전 $version 이 다릅니다. package.json을 먼저 올리세요." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - run: bun run app:build

      # electron-builder가 파일을 병렬로 올리며 Release를 각각 만들어 같은 태그에 둘이 생기는 경합이 있다.
      # 먼저 만들어 두면 있는 Release에 올리기만 한다
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --publish always: 태그 빌드는 언제나 Release에 올린다 (기본값은 CI 감지에 따라 달라진다)
      - run: bunx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
