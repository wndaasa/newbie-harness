<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Newbie Pet</title>
<style>
  /* 톤: 저채도, 조용한 색. 요란한 효과 금지. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; justify-content: flex-end;
    /* 여백은 drag 영역으로 두지 않는다. 보이지 않는 여백은 클릭을 아래 창(작업
       표시줄 등)으로 흘려보낸다(renderer.js updatePointer). 옮기기는 펫을 잡아 끈다 */
    user-select: none;
  }

  /* 창 너비(240px)를 다 채우면 92px 펫을 덮는 판이 된다. 펫보다 조금 넓은 정도로
     가운데에 둔다 */
  #bubble {
    -webkit-app-region: no-drag;
    align-self: center;
    width: 184px;
    max-width: 100%;
    background: rgba(46, 48, 56, 0.94);
    color: #e8e8ea;
    border-radius: 10px;
    padding: 7px 9px;
    margin-bottom: 8px;
    font-size: 11px;
    line-height: 1.45;
    display: none;
  }
  #bubble.visible { display: block; }
  #bubble .q-text { margin-bottom: 6px; }

  textarea, input {
    -webkit-app-region: no-drag;
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 6px;
    color: #e8e8ea;
    font-size: 11px;
    padding: 4px 6px;
    margin-bottom: 6px;
    font-family: inherit;
    resize: none;
  }
  textarea { height: 34px; }
  /* 기본 포커스 링은 주황색이라 저채도 팔레트에서 혼자 튄다.
     키보드 사용자가 위치를 잃지 않게 링 자체는 남긴다 */
  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid rgba(168, 186, 214, 0.65);
    outline-offset: 1px;
  }

  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    -webkit-app-region: no-drag;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    color: #e8e8ea;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.2); }
  .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }
  .mood-grid button { padding: 3px 0; }

  #pet {
    width: 92px; height: 92px;
    margin: 0 auto 6px auto;
    background: #7d8aa5; /* 저채도 블루그레이 */
    border-radius: 50%;
    position: relative;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    /* 표정이 바뀌는 순간을 못 보고 지나가도 되게 서서히 바꾼다. 요란한 효과는 쓰지 않는다 */
    transition: background-color 700ms ease;
    /* drag 영역은 마우스 이벤트를 창 이동으로 삼켜서 hover·click이 렌더러까지
       오지 않는다. 펫은 만질 수도 있고 잡아 옮길 수도 있어야 하므로, 여기서는
       no-drag로 두고 창 이동은 renderer.js가 직접 처리한다 */
    -webkit-app-region: no-drag;
    cursor: grab;
  }
  #pet:active { cursor: grabbing; }
  #pet .eye {
    position: absolute; top: 34px;
    width: 12px; height: 14px;
    background: #2e3038;
    border-radius: 50%;
    animation: blink 5s infinite;
    transition: top 300ms ease, height 300ms ease, translate 300ms ease;
  }
  #pet .eye.left { left: 25px; }
  #pet .eye.right { right: 25px; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  /* ---------- 표정 ----------
     #pet에는 face-* 클래스가 항상 하나 붙어 있다. 평소는 face-rest —
     입이 없는 원래 얼굴이고, 표정은 반응할 때만 잠깐 나타난다.
     입은 테두리 한 변 + 모서리 라운드로 그린 호(arc)다. 색은 얼굴 배경만
     아주 조금 움직인다 — 기분을 색으로 소리치지 않기 위해서. */
  #pet.face-rest { background: #7d8aa5; }

  #pet .mouth {
    display: none; /* 표정 클래스가 붙었을 때만 나타난다 */
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    /* 테두리 방향이 구간마다 바뀌므로 크기·위치만 전환한다(all은 중간 프레임이 깨짐) */
    transition: top 300ms ease, width 300ms ease, height 300ms ease;
  }
  #pet.face-sad .mouth,
  #pet.face-neutral .mouth,
  #pet.face-smile .mouth,
  #pet.face-grin .mouth { display: block; }

  /* 5 — 무표정 (입이 있는 일자 표정. 평소 얼굴인 face-rest와는 다르다) */
  #pet.face-neutral { background: #7d8aa5; }
  #pet.face-neutral .mouth {
    top: 60px; width: 16px; height: 2px;
    background: #2e3038; border-radius: 1px;
  }

  /* 6~8 — 미소 */
  #pet.face-smile { background: #7f93a6; }
  #pet.face-smile .mouth {
    top: 55px; width: 24px; height: 11px;
    border-bottom: 2.5px solid #2e3038;
    border-radius: 0 0 24px 24px;
  }

  /* 9~10 — 함박웃음: 입이 벌어지고 눈이 접힌다 */
  #pet.face-grin { background: #869ab0; }
  #pet.face-grin .mouth {
    top: 53px; width: 30px; height: 15px;
    background: #2e3038;
    border-radius: 0 0 30px 30px;
  }
  #pet.face-grin .eye {
    top: 37px; height: 7px;
    background: none;
    border-top: 2.5px solid #2e3038;
    border-radius: 12px 12px 0 0;
    animation: none; /* 접힌 눈은 깜빡일 수 없다 */
  }

  /* 1~4 — 우는 표정: 입꼬리가 내려가고 눈꺼풀이 처진다 */
  #pet.face-sad { background: #6f7b90; }
  #pet.face-sad .mouth {
    top: 62px; width: 20px; height: 9px;
    border-top: 2.5px solid #2e3038;
    border-radius: 20px 20px 0 0;
  }
  #pet.face-sad .eye { top: 36px; height: 11px; }

  /* 눈물은 sad에서만 흐른다. 주기를 길게 둬서 시선을 끌지 않게 한다 */
  #pet .tear {
    position: absolute;
    left: 27px; top: 48px;
    width: 6px; height: 8px;
    background: #b9cbe0;
    border-radius: 50% / 60% 60% 40% 40%;
    opacity: 0;
  }
  #pet.face-sad .tear { animation: tear-fall 5s ease-in infinite; }
  @keyframes tear-fall {
    0%, 60% { opacity: 0; transform: translateY(0); }
    68% { opacity: 0.85; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(20px); }
  }

  /* 관심을 받으면 얼굴이 달아오른다.
     표정 클래스가 저마다 background를 잡고 있으므로 색을 두고 다투는 대신 레이어를
     하나 얹는다 — 표정과 독립적으로 페이드를 제어할 수 있고 순서에 기대지 않는다.
     DOM에서 눈·입보다 먼저 와야 이목구비가 위에 그려진다.
     달아오르는 건 빠르게, 식는 건 느리게 — 온기가 남는 느낌을 만든다.
     커서가 머무는 동안에는 계속 유지된다(mouseleave에서만 꺼진다). */
  #pet .blush {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #e8a56f; /* 명도 높은 오렌지 */
    opacity: 0;
    pointer-events: none;
    transition: opacity 900ms ease-out;
  }
  #pet.warm .blush {
    opacity: 0.8;
    transition: opacity 320ms ease-in;
  }

  /* ---------- 걷기 ----------
     걷는 그림은 따로 없다. 창은 main(petRoam.ts)이 옆으로 옮기고, 여기서는 한 장을
     바닥 축으로 좌우로 기울이며 통통 튀게 해 뒤뚱걸음으로 보이게 한다.
     rotate/translate 개별 속성을 써서 giggle의 transform과 겹치지 않게 한다.
     --dir(1 오른쪽, -1 왼쪽)는 renderer.js가 정한다 */
  #pet.walk { transform-origin: 50% 100%; animation: waddle 640ms ease-in-out infinite; }
  @keyframes waddle {
    0%, 100% { rotate: -5deg; translate: 0 0; }
    25% { rotate: 0deg; translate: 0 -4px; }
    50% { rotate: 5deg; translate: 0 0; }
    75% { rotate: 0deg; translate: 0 -4px; }
  }
  /* 걷기 프레임이 두 장 이상이면 그림이 걸음을 맡는다. 몸을 기울이면 그림 속 걸음과
     겹쳐 어지럽다 — 바닥에 붙인 채 좌우 반전만 남긴다 */
  #pet.flipbook.walk { animation: none; }
  /* 그린 얼굴은 좌우가 같아 뒤집어도 티가 안 난다. 눈길로 가는 쪽을 보인다 */
  #pet.walk .eye { translate: calc(var(--dir, 1) * 3px) 0; }

  /* 커서가 닿으면 웃으면서 부르르 떤다. 짧고 작게 — 창이 흔들리는 게 아니라
     펫이 웃는 것으로 읽혀야 한다 */
  #pet.giggle { animation: giggle 900ms ease-in-out; }
  @keyframes giggle {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    12% { transform: translateX(-2px) rotate(-4.5deg); }
    28% { transform: translateX(2px) rotate(4.5deg); }
    44% { transform: translateX(-2px) rotate(-3.5deg); }
    60% { transform: translateX(2px) rotate(3deg); }
    78% { transform: translateX(-1px) rotate(-1.5deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    #pet .eye { animation: none; }
    #pet.face-sad .tear { animation: none; opacity: 0.8; }
    #pet.giggle { animation: none; } /* 표정은 남기고 흔들림만 뺀다 */
    #pet.walk { animation: none; } /* 창은 움직이되 몸은 흔들지 않는다 */
  }

  /* ---------- 사용자 이미지 ----------
     설정 탭에서 고른 이미지가 있으면 그린 얼굴 대신 보인다. 흔들림(giggle)과
     드래그 같은 모션은 그대로 두고, 표정·색(face-*, warm)만 무시한다 — 표정을
     이미지에 입히는 건 추후 고도화 대상이다. face-* 규칙과 같은 특이성이라
     뒤에 둬야 이긴다 */
  #pet img {
    display: none;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    /* 사용자 이미지는 가는 쪽을 보게 뒤집는다. 돌아설 때 납작해졌다 펴져 몸을 돌리는 것처럼 보인다 */
    transform: scaleX(var(--dir, 1));
    transition: transform 180ms ease;
  }
  #pet.custom { background: transparent; box-shadow: none; border-radius: 0; }
  #pet.custom img { display: block; }
  #pet.custom .eye, #pet.custom .mouth, #pet.custom .tear, #pet.custom .blush { display: none; }
  #toolbar {
    display: flex; justify-content: center; gap: 8px;
    padding-bottom: 8px;
  }
  #toolbar button {
    font-size: 11px;
    background: rgba(46, 48, 56, 0.7);
    border: none;
    color: #c8c8cc;
  }
</style>
</head>
<body>
  <div id="bubble"></div>
  <!-- face-rest가 평소 얼굴 — 입이 없다. 표정은 반응할 때만 붙는다 -->
  <div id="pet" class="face-rest">
    <div class="blush"></div>
    <div class="eye left"></div><div class="eye right"></div>
    <div class="mouth"></div><div class="tear"></div>
    <img id="pet-image" alt="" />
  </div>
  <div id="toolbar">
    <button id="btn-now" title="지금 확인">💭</button>
    <button id="btn-close" title="닫기">✕</button>
  </div>
  <!-- vite는 module 스크립트만 번들한다 -->
  <script type="module" src="./src/pet/renderer.js"></script>
</body>
</html>
